<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive gallery of scenic destinations.">
  <title>HW7 | Scenic Escape Gallery</title>
  <link rel="stylesheet" href="hw8.moyegunm.css">
</head>
<body>
  <header class="site-header">
    <h1>Scenic Escape Gallery</h1>
    <p>Six beautiful places, one photo collection.</p>
  </header>
  <main class="gallery" aria-label="Scenic photo gallery">
    <div class="photo photo-1" data-caption="Mountains at sunrise" role="img" aria-label="Mountains at sunrise"></div>
    <div class="photo photo-2" data-caption="Ocean coastline" role="img" aria-label="Ocean coastline"></div>
    <div class="photo photo-3" data-caption="Forest getaway" role="img" aria-label="Forest getaway"></div>
    <div class="photo photo-4" data-caption="Desert adventure" role="img" aria-label="Desert adventure"></div>
    <div class="photo photo-5" data-caption="City after dark" role="img" aria-label="City after dark"></div>
    <div class="photo photo-6 featured" data-caption="Peaceful lake" role="img" aria-label="Peaceful lake"></div>
  </main>
  <footer><p>HW7 • Responsive CSS Photo Gallery</p></footer>
</body>
</html>
